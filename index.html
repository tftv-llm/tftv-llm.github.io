<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="TFTV — Training-Free Task Vectors for LLM Behavioral Control">
  <meta name="theme-color" content="#080d18">
  <title>TFTV — Coming Soon</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #080d18;
      color: #f3f7ff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
      background:
        radial-gradient(circle at 50% 25%, rgba(70, 119, 255, 0.18), transparent 36rem),
        #080d18;
    }

    main { max-width: 760px; text-align: center; }

    .label {
      margin-bottom: 1.5rem;
      color: #70e2d0;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(4rem, 15vw, 8rem);
      line-height: 0.9;
      letter-spacing: -0.08em;
    }

    p {
      max-width: 610px;
      margin: 2rem auto 0;
      color: #aebbd0;
      font-size: clamp(1rem, 2vw, 1.25rem);
      line-height: 1.7;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      margin-top: 2.5rem;
      padding: 0.65rem 0.9rem;
      border: 1px solid #26334a;
      color: #cad5e7;
      font-size: 0.85rem;
    }

    .dot {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background: #70e2d0;
      box-shadow: 0 0 1rem rgba(112, 226, 208, 0.8);
    }
  </style>
</head>
<body>
  <main>
    <div class="label">Training-Free Task Vectors</div>
    <h1>TFTV</h1>
    <p>A training-free framework for translating activation-space steering signals into persistent parameter-space model edits.</p>
    <div class="status"><span class="dot" aria-hidden="true"></span> Website under construction</div>
  </main>
</body>
</html>
